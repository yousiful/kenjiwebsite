[build]
publish = "dist"
command = "npx vite build"

# Node version for consistent builds
[build.environment]
NODE_VERSION = "20"

# ── SPA routing ──
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# ── Global security & performance headers ──
[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self), usb=()"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# ── HTML shell — never cache ──
[[headers]]
for = "/"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
Pragma = "no-cache"
Expires = "0"

[[headers]]
for = "/*.html"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
Pragma = "no-cache"
Expires = "0"

# ── Service worker — never cache ──
[[headers]]
for = "/sw.js"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
Pragma = "no-cache"
Expires = "0"

# ── Hashed assets — immutable 1 year ──
[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# ── Fonts — immutable 1 year + CORS ──
[[headers]]
for = "/assets/*.woff2"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Access-Control-Allow-Origin = "*"

[[headers]]
for = "/assets/*.woff"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Access-Control-Allow-Origin = "*"

# ── Sitemap & robots ──
[[headers]]
for = "/sitemap.xml"

[headers.values]
Cache-Control = "public, max-age=86400"
Content-Type = "application/xml; charset=UTF-8"

[[headers]]
for = "/robots.txt"

[headers.values]
Cache-Control = "public, max-age=86400"

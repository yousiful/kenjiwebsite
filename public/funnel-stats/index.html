<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Funnel Drop-Off</title>
<style>
  :root { --bg:#0b0f17; --card:#131a26; --line:#243045; --text:#e8edf5; --muted:#8a97ab; --bar:#2bb3a3; --bar2:#3a7bd5; --bad:#e5604d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:16px; margin:28px 0 10px; }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:14px 0; }
  input, select, button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  button { cursor:pointer; background:var(--bar2); border-color:var(--bar2); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .tile b { display:block; font-size:26px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .step { display:grid; grid-template-columns:170px 1fr 120px; gap:10px; align-items:center; padding:5px 0; }
  .track { background:#0e1520; border-radius:6px; height:22px; overflow:hidden; }
  .fill { height:100%; background:var(--bar); border-radius:6px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .drop { color:var(--bad); font-size:12px; }
  .alert { border-left:4px solid var(--bad); padding:10px 14px; background:#1d1416; border-radius:6px; margin-top:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  @media (max-width:600px){ .step { grid-template-columns:110px 1fr 84px; font-size:13px; } }
</style>
</head>
<body>
<main>
  <h1>Where people drop off</h1>
  <div class="muted">Every step a visitor reaches, from landing to clicking through to checkout. Order form steps (opt-in, payment) happen on GHL and aren't in this view.</div>

  <div class="row">
    <select id="funnel"><option value="lowticket">Freedom Club page (startlearning)</option><option value="kenjiai">kenjiai.com (all pages)</option></select>
    <input id="secret" type="password" placeholder="Stats secret" size="22">
    <select id="days"><option value="1">Today</option><option value="3">3 days</option><option value="7" selected>7 days</option><option value="14">14 days</option><option value="30">30 days</option></select>
    <select id="device"><option value="">All devices</option><option value="mobile">Mobile</option><option value="desktop">Desktop</option></select>
    <button id="load">Load</button>
    <span id="status" class="muted"></span>
  </div>

  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
try { $('secret').value = localStorage.getItem('funnelStatsSecret') || ''; } catch {}

const SCROLL = [['scroll_25', 'Scrolled 25%'], ['scroll_50', 'Scrolled 50%'], ['scroll_75', 'Scrolled 75%'], ['scroll_100', 'Reached the bottom']];
const FUNNEL = [
  ['page_view', 'Landed on page'],
  ['time_10s', 'Stayed 10s+'],
  ['video_play', 'Pressed play'],
  ['video_25', 'Video 25%'],
  ['video_50', 'Video 50%'],
  ['video_75', 'Video 75%'],
  ['video_100', 'Finished video'],
  ['cta_click', 'Clicked a CTA'],
];
const SECTIONS = [
  ['section_hero','Hero'],['section_proof','Proof stats'],['section_pain','Pain'],['section_member_area','Member area'],
  ['section_how_it_works','How it works'],['section_objections','Objections'],['section_reviews','Reviews'],
  ['section_faq','FAQ'],['section_final_cta','Final CTA'],
];
const CTAS = [['cta_hero-cta','Hero button'],['cta_dashboard-cta','Member-area button'],['cta_final-cta','Final button'],['cta_sticky-mobile-cta','Sticky mobile bar'],['cta_exit-popup','Exit popup']];

function count(sessions, step) { return sessions.filter(s => s.steps[step]).length; }
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

function bars(title, rows, sessions, base) {
  let html = `<h2>${title}</h2><div class="card">`;
  let prev = null;
  for (const [step, label] of rows) {
    const n = count(sessions, step);
    const drop = prev !== null && prev > 0 ? Math.round((prev - n) / prev * 100) : null;
    html += `<div class="step"><div>${label}</div><div class="track"><div class="fill" style="width:${pct(n, base)}%"></div></div>
      <div class="num">${n} <span class="muted">(${pct(n, base)}%)</span>${drop !== null && drop > 0 ? `<div class="drop">-${drop}% from above</div>` : ''}</div></div>`;
    prev = n;
  }
  return html + '</div>';
}

function render(data) {
  const dev = $('device').value;
  const sessions = data.sessions.filter(s => !dev || s.device === dev).filter(s => s.steps.page_view)
    .filter(s => !(s.utm_content || '').startsWith('claude-e2e')) // Claude's own test visits
    .filter(s => !pageFilter || s.page === pageFilter);
  const total = sessions.length;
  if (!total) { $('out').innerHTML = '<div class="card">No visits recorded yet for this range. Tracking started when the new page went live.</div>'; return; }

  const clicks = count(sessions, 'cta_click');
  const played = count(sessions, 'video_play');
  const bounced = sessions.filter(s => !s.steps.time_10s && !s.steps.video_play && !s.steps.cta_click).length;

  // Biggest single drop along the main path.
  let worst = null, prev = null, prevLabel = '';
  for (const [step, label] of mainPath()) {
    const n = count(sessions, step);
    if (prev) { const lost = prev - n; if (!worst || lost / prev > worst.rate) worst = { from: prevLabel, to: label, rate: lost / prev, lost }; }
    prev = n; prevLabel = label;
  }

  let html = `<div class="tiles">
    <div class="tile"><span class="muted">Visitors</span><b>${total}</b></div>
    <div class="tile"><span class="muted">Left in under 10s</span><b>${pct(bounced, total)}%</b></div>
    <div class="tile"><span class="muted">Pressed play</span><b>${pct(played, total)}%</b></div>
    <div class="tile"><span class="muted">Clicked to checkout</span><b>${pct(clicks, total)}%</b></div>
  </div>`;
  if (pageFilter) html += `<div class="alert" style="border-left-color:var(--bar2);background:#121b2b">Showing only <b>${pageFilter.replace(/[<>&]/g, '')}</b>. Click it again in the page table to see everything.</div>`;
  if (worst) html += `<div class="alert"><b>Biggest leak:</b> ${worst.from} &rarr; ${worst.to}: lost ${worst.lost} people (${Math.round(worst.rate * 100)}%).</div>`;

  html += bars('Main path', mainPath(), sessions, total);
  html += bars('Where we lose the scroll', SCROLL, sessions, total);
  if (data.funnel === 'lowticket') html += bars('Which sections they reached', SECTIONS, sessions, total);
  html += vslCurve(sessions);
  html += byPage(data.sessions) + byVersion(sessions);

  html += '<h2>Which button they clicked</h2><div class="card"><table><tr><th>Button</th><th class="n">Clicks</th><th class="n">% of clicks</th></tr>';
  for (const [step, label] of CTAS) { const n = count(sessions, step); html += `<tr><td>${label}</td><td class="n">${n}</td><td class="n">${pct(n, clicks)}%</td></tr>`; }
  html += '</table></div>';

  // By ad (utm_content), then by device.
  const groups = {};
  for (const s of sessions) { const k = s.utm_content || s.utm_campaign || s.utm_source || '(no utm)'; (groups[k] ||= []).push(s); }
  html += '<h2>By ad / source</h2><div class="card"><table><tr><th>Ad / source</th><th class="n">Visitors</th><th class="n">Played</th><th class="n">Clicked CTA</th></tr>';
  for (const [k, ss] of Object.entries(groups).sort((a, b) => b[1].length - a[1].length).slice(0, 25)) {
    html += `<tr><td>${k.replace(/[<>&]/g, '')}</td><td class="n">${ss.length}</td><td class="n">${pct(count(ss, 'video_play'), ss.length)}%</td><td class="n">${pct(count(ss, 'cta_click'), ss.length)}%</td></tr>`;
  }
  html += '</table></div>';

  $('out').innerHTML = html;
}


// Second-by-second video drop-off for pages that send vsl_* steps (the pricing VSL A/B test).
function vslCurve(sessions) {
  const ids = [...new Set(sessions.flatMap(s => Object.keys(s.steps).filter(k => k.startsWith('vsl_v_')).map(k => k.slice(6))))].sort();
  if (!ids.length) return '';
  const colors = ['#2bb3a3', '#e5a64d', '#3a7bd5', '#c46bd1'];
  const fmt = (t) => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  let lines = '', legend = '', table = '<table><tr><th>Version</th><th class="n">Visitors</th><th class="n">Pressed play</th><th class="n">Still watching at 0:30</th><th class="n">Finished</th><th class="n">Checkout clicks / 100 visitors</th><th>Biggest exits</th></tr>';
  let maxT = 0;
  const data = ids.map((id) => {
    const ss = sessions.filter(s => s.steps['vsl_v_' + id]);
    const played = ss.filter(s => s.steps.vsl_t0 || s.steps.video_play);
    const ts = played.flatMap(s => Object.keys(s.steps).filter(k => /^vsl_t\d+$/.test(k)).map(k => +k.slice(5)));
    const top = ts.length ? Math.max(...ts) : 0; maxT = Math.max(maxT, top);
    const curve = []; for (let t = 0; t <= top; t += 5) curve.push([t, played.filter(s => s.steps['vsl_t' + t]).length]);
    return { id, ss, played, curve };
  });
  const W = 860, H = 220;
  data.forEach((d, i) => {
    const base = d.played.length || 1;
    const pts = d.curve.map(([t, n]) => `${(t / Math.max(maxT, 5) * W).toFixed(1)},${(H - n / base * H).toFixed(1)}`).join(' ');
    lines += `<polyline fill="none" stroke="${colors[i % 4]}" stroke-width="2.5" points="${pts}"/>`;
    legend += `<span style="color:${colors[i % 4]};margin-right:14px">&#9632; Version ${d.id.toUpperCase()}</span>`;
    const drops = [];
    for (let k = 1; k < d.curve.length; k++) drops.push([d.curve[k - 1][0], d.curve[k - 1][1] - d.curve[k][1]]);
    const worst = drops.filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([t, n]) => `${fmt(t)}&ndash;${fmt(t + 5)} (-${n})`).join(', ');
    const at30 = (d.curve.find(c => c[0] === 30) || [0, 0])[1];
    table += `<tr><td>${d.id.toUpperCase()}</td><td class="n">${d.ss.length}</td><td class="n">${pct(d.played.length, d.ss.length)}%</td><td class="n">${pct(at30, d.played.length)}%</td><td class="n">${pct(count(d.ss, 'vsl_end'), d.played.length)}%</td><td class="n">${d.ss.length ? (count(d.ss, 'cta_click') / d.ss.length * 100).toFixed(1) : '0'}</td><td>${worst || '&ndash;'}</td></tr>`;
  });
  const ticks = []; for (let t = 0; t <= maxT; t += 30) ticks.push(`<text x="${(t / Math.max(maxT, 5) * W).toFixed(0)}" y="${H + 16}" fill="#8a97ab" font-size="12">${fmt(t)}</text>`);
  return `<h2>Video drop-off, second by second</h2><div class="card"><div class="muted" style="margin-bottom:8px">Share of people who pressed play that were still watching at each moment. Skipped-ahead stretches don't count. ${legend}</div>
    <svg viewBox="0 0 ${W} ${H + 22}" style="width:100%;height:auto"><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#243045"/><line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" stroke="#243045" stroke-dasharray="4 4"/>${lines}${ticks.join('')}</svg>
    ${table}</table><div class="muted" style="margin-top:8px">The winner is the version with the most checkout clicks per 100 visitors, not the longest watch time. Wait for 50+ plays per version before calling it.</div></div>`;
}

let pageFilter = '';
function mainPath() {
  return last && last.funnel === 'kenjiai'
    ? [['page_view', 'Landed on page'], ['time_10s', 'Stayed 10s+'], ['scroll_50', 'Scrolled halfway'], ['scroll_100', 'Reached the bottom'], ['cta_click', 'Clicked to checkout/booking']]
    : FUNNEL;
}
const clean = (list) => list.filter(s => s.steps.page_view && !(s.utm_content || '').startsWith('claude-e2e'));
function byPage(all) {
  const groups = {};
  for (const s of clean(all)) (groups[s.page || '/'] ||= []).push(s);
  const rows = Object.entries(groups).sort((a, b) => b[1].length - a[1].length).slice(0, 30);
  if (rows.length < 2 && !pageFilter) return '';
  let h = '<h2>Every page: where the scroll stops</h2><div class="card"><table><tr><th>Page</th><th class="n">Visits</th><th class="n">25%</th><th class="n">50%</th><th class="n">75%</th><th class="n">Bottom</th><th class="n">Clicked</th><th>Biggest drop</th></tr>';
  for (const [pg, ss] of rows) {
    const n = (k) => count(ss, k), steps = [ss.length, n('scroll_25'), n('scroll_50'), n('scroll_75'), n('scroll_100')];
    const names = ['landing', '25%', '50%', '75%', 'bottom'];
    let worst = '', wr = 0;
    for (let i = 1; i < steps.length; i++) if (steps[i - 1] && (steps[i - 1] - steps[i]) / steps[i - 1] > wr) { wr = (steps[i - 1] - steps[i]) / steps[i - 1]; worst = `${names[i - 1]} &rarr; ${names[i]} (-${Math.round(wr * 100)}%)`; }
    const esc = pg.replace(/[<>&"]/g, '');
    h += `<tr><td><a href="#" data-page="${esc}" style="color:inherit">${esc}</a></td><td class="n">${ss.length}</td>` + steps.slice(1).map(v => `<td class="n">${pct(v, ss.length)}%</td>`).join('') + `<td class="n">${pct(n('cta_click'), ss.length)}%</td><td>${worst}</td></tr>`;
  }
  return h + '</table><div class="muted" style="margin-top:8px">Click a page to see only its numbers above.</div></div>';
}
function byVersion(sessions) {
  const groups = {};
  for (const s of sessions) (groups[s.version || 'before-versioning'] ||= []).push(s);
  const rows = Object.entries(groups).sort((a, b) => (a[0] < b[0] ? 1 : -1));
  let h = '<h2>Did the last change help? (by page version)</h2><div class="card"><table><tr><th>Version (deploy)</th><th class="n">Visits</th><th class="n">Stayed 10s</th><th class="n">Scrolled 50%</th><th class="n">Pressed play</th><th class="n">Clicked CTA</th></tr>';
  for (const [v, ss] of rows) h += `<tr><td>${v.replace(/[<>&]/g, '')}</td><td class="n">${ss.length}</td><td class="n">${pct(count(ss, 'time_10s'), ss.length)}%</td><td class="n">${pct(count(ss, 'scroll_50'), ss.length)}%</td><td class="n">${pct(count(ss, 'video_play'), ss.length)}%</td><td class="n">${pct(count(ss, 'cta_click'), ss.length)}%</td></tr>`;
  return h + '</table><div class="muted" style="margin-top:8px">Each deploy is a new version. Compare once a version has 50+ visits; small numbers swing a lot.</div></div>';
}
let last = null;
async function load() {
  const secret = $('secret').value.trim();
  try { localStorage.setItem('funnelStatsSecret', secret); } catch {}
  $('status').textContent = 'Loading...';
  try {
    // One request per day, in parallel: a multi-day read of site-wide traffic times out in one call.
    const days = Number($('days').value);
    const rs = await Promise.all([...Array(days).keys()].map(d =>
      fetch(`/.netlify/functions/funnel-stats?offset=${d}&funnel=${$('funnel').value}`, { headers: { 'x-webinar-stats-secret': secret } })));
    if (rs.some(r => r.status === 401)) { $('status').textContent = 'Wrong secret.'; return; }
    const bad = rs.filter(r => !r.ok).length;
    const parts = await Promise.all(rs.filter(r => r.ok).map(r => r.json()));
    // A visit that crosses midnight UTC is in two days' results; join it back up by sid.
    const bySid = new Map();
    for (const s of parts.flatMap(p => p.sessions)) {
      const m = bySid.get(s.sid);
      if (!m) { bySid.set(s.sid, s); continue; }
      Object.assign(m.steps, s.steps);
      for (const k of ['firstSeen', 'utm_source', 'utm_campaign', 'utm_content', 'device', 'page', 'version']) if (!m[k] && s[k]) m[k] = s[k];
    }
    last = { sessions: [...bySid.values()], fetchedAt: new Date().toISOString() };
    if (bad) $('status').textContent = `${bad} of ${days} days failed to load, numbers are partial. `;
    $('status').textContent = (bad ? $('status').textContent : '') + `Updated ${new Date(last.fetchedAt).toLocaleTimeString()}`;
    render(last);
  } catch (e) { $('status').textContent = 'Could not load: ' + e.message; }
}
$('load').onclick = load;
$('device').onchange = () => last && render(last);
$('days').onchange = load;
$('funnel').onchange = () => { pageFilter = ''; load(); };
document.addEventListener('click', (e) => { const a = e.target.closest('[data-page]'); if (!a) return; e.preventDefault(); pageFilter = pageFilter === a.dataset.page ? '' : a.dataset.page; render(last); });
if ($('secret').value) load();
</script>
</body>
</html>

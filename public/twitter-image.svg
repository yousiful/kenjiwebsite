<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333EA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="50" fill="#3B82F6" opacity="0.1"/>
  <circle cx="1050" cy="480" r="70" fill="#9333EA" opacity="0.1"/>

  <!-- Logo/Brand -->
  <text x="600" y="140" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#textGradient)" text-anchor="middle">KenjiAI</text>

  <!-- Main Headline -->
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Free AI Tools +</text>
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Complete Automation</text>

  <!-- Features -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">✨ Voice Agents • Smart Workflows • CRM</text>

  <!-- CTA -->
  <rect x="450" y="450" width="300" height="60" rx="30" fill="#3B82F6"/>
  <text x="600" y="488" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Start Free Today</text>

  <!-- Social Proof -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="middle">Join 50,000+ businesses automating with AI</text>
</svg>

<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="spotLight">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Spotlight Effects -->
  <circle cx="300" cy="150" r="300" fill="url(#spotLight)"/>
  <circle cx="900" cy="480" r="300" fill="url(#spotLight)"/>

  <!-- Decorative Grid Pattern -->
  <g opacity="0.1">
    <path d="M 0 0 L 1200 630 M 0 630 L 1200 0" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="600" cy="315" r="200" stroke="#10b981" stroke-width="2" fill="none"/>
    <circle cx="600" cy="315" r="150" stroke="#3b82f6" stroke-width="2" fill="none"/>
  </g>

  <!-- Christmas Decorations -->
  <g opacity="0.8">
    <!-- Snowflakes -->
    <g transform="translate(100, 80)">
      <path d="M 0 -15 L 0 15 M -15 0 L 15 0 M -10 -10 L 10 10 M -10 10 L 10 -10"
            stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle r="3" fill="#fff"/>
    </g>
    <g transform="translate(1050, 100)">
      <path d="M 0 -12 L 0 12 M -12 0 L 12 0 M -8 -8 L 8 8 M -8 8 L 8 -8"
            stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle r="2.5" fill="#fff"/>
    </g>
    <g transform="translate(150, 520)">
      <path d="M 0 -10 L 0 10 M -10 0 L 10 0 M -7 -7 L 7 7 M -7 7 L 7 -7"
            stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle r="2" fill="#fff"/>
    </g>
    <g transform="translate(1100, 500)">
      <path d="M 0 -13 L 0 13 M -13 0 L 13 0 M -9 -9 L 9 9 M -9 9 L 9 -9"
            stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle r="2.5" fill="#fff"/>
    </g>
    <!-- Stars -->
    <circle cx="200" cy="150" r="3" fill="#fbbf24"/>
    <circle cx="950" cy="520" r="4" fill="#fbbf24"/>
    <circle cx="1000" cy="200" r="3" fill="#fbbf24"/>
  </g>

  <!-- Logo K -->
  <g transform="translate(150, 280)" filter="url(#glow)">
    <path d="M 0 -50 L 0 50 M 0 0 L 40 -50 M 0 0 L 45 50"
          stroke="url(#accentGrad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- Main Text -->
  <text x="250" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#fff" filter="url(#glow)">
    KenjiAI
  </text>

  <!-- Subheading -->
  <text x="250" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="url(#accentGrad)">
    AI Business Automation Platform
  </text>

  <!-- Feature Pills -->
  <g transform="translate(250, 380)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="200" height="50" rx="25" fill="#3b82f6" opacity="0.2"/>
    <rect x="0" y="0" width="200" height="50" rx="25" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">
      Voice Agents 24/7
    </text>

    <!-- Pill 2 -->
    <rect x="220" y="0" width="180" height="50" rx="25" fill="#10b981" opacity="0.2"/>
    <rect x="220" y="0" width="180" height="50" rx="25" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="310" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">
      Smart CRM
    </text>

    <!-- Pill 3 -->
    <rect x="420" y="0" width="220" height="50" rx="25" fill="#3b82f6" opacity="0.2"/>
    <rect x="420" y="0" width="220" height="50" rx="25" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="530" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">
      Free AI Tools
    </text>
  </g>

  <!-- Stats/Social Proof -->
  <g transform="translate(250, 480)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#10b981">
      50,000+
    </text>
    <text x="150" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#9ca3af">
      Businesses Automated
    </text>
  </g>

  <!-- CTA -->
  <g transform="translate(250, 540)">
    <rect x="0" y="0" width="250" height="60" rx="30" fill="url(#accentGrad)" filter="url(#glow)"/>
    <text x="125" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">
      Get Started Free
    </text>
  </g>

  <!-- Holiday Accents -->
  <circle cx="240" cy="270" r="8" fill="#ef4444" opacity="0.9"/>
  <circle cx="240" cy="350" r="8" fill="#10b981" opacity="0.9"/>
  <circle cx="750" cy="530" r="6" fill="#fbbf24" opacity="0.9"/>
</svg>

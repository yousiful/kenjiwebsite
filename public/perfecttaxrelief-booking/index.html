<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --line:#e4e7ec;
    --ink:#101828; --muted:#475467;
    --green:#16a34a; --green2:#15803d;

  @media (prefers-color-scheme: dark){

  }

  .sub{color:var(--muted);font-size:16px;max-width:520px;margin:0 auto 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px -18px rgba(16,24,40,.15)}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:28px 0 40px}

    <!-- Hide loading screen when app loads -->
    <script>
      (function() {
        var checkReactLoaded = setInterval(function() {
          var root = document.getElementById('root');
          var loader = document.getElementById('app-loading');

          if (root && root.children.length > 0) {
            loader.classList.add('hide');
            setTimeout(function() {
              loader.style.display = 'none';
            }, 300);
            clearInterval(checkReactLoaded);
            sessionStorage.removeItem('reload-count');
            sessionStorage.removeItem('last-reload');
          }
        }, 100);

        setTimeout(function() {
          var loader = document.getElementById('app-loading');
          var reloadCount = parseInt(sessionStorage.getItem('reload-count') || '0');
          var lastReload = parseInt(sessionStorage.getItem('last-reload') || '0');
          var timeSinceReload = Date.now() - lastReload;

          if (loader && !loader.classList.contains('hide') && reloadCount < 1 && timeSinceReload > 5000) {
            console.log('[Loader] Page stuck loading, clearing cache...');

            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                  registration.unregister();
                }
              });
            }

            sessionStorage.setItem('reload-count', '1');
            sessionStorage.setItem('last-reload', Date.now().toString());
            location.reload();
          } else if (reloadCount >= 1) {
            loader.classList.add('hide');
            setTimeout(function() {
              loader.style.display = 'none';
            }, 300);
            sessionStorage.removeItem('reload-count');
            sessionStorage.removeItem('last-reload');
          }
        }, 10000);
      })();
    </script>

    <!-- Service Worker registration with smart cache clearing -->
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:' && !/HeadlessChrome|Prerender/i.test(navigator.userAgent)) {
        (async function() {
          try {
            if ('caches' in window) {
              const cacheNames = await caches.keys();
              const CURRENT_CACHE = 'kenjiai-v5-2025';
              const hasOldCaches = cacheNames.some(name =>
                name.includes('kenjiai') && name !== CURRENT_CACHE
              );

              if (hasOldCaches) {
                for (let cacheName of cacheNames) {
                  if (cacheName !== CURRENT_CACHE) {
                    await caches.delete(cacheName);
                  }
                }

                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                  await registration.unregister();
                  console.log('[SW] Unregistered old service worker');
                }
              }
            }

            window.addEventListener('load', async () => {
              try {
                const registration = await navigator.serviceWorker.register('/sw.js');
                console.log('[SW] Service worker registered');

                registration.addEventListener('updatefound', () => {
                  console.log('[SW] Update found, installing new version');
                });

                if (navigator.serviceWorker.controller) {
                  console.log('[SW] Page is controlled by service worker');
                }
              } catch (error) {
                console.log('[SW] Registration failed:', error);
              }
            });
          } catch (error) {
            console.log('[SW] Cleanup failed:', error);
          }
        })();
      }
    </script>
